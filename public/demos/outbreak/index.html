<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outbreak</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      /* Largest 4:3 box that fits the window. The game still renders at 1024x768. */
      #unity-canvas {
        display: block;
        width: min(100vw, calc(100vh * 4 / 3));
        height: min(100vh, calc(100vw * 3 / 4));
        background: #000;
        outline: none;
      }
      #loading {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(40vw, 320px); height: 6px; background: #2a2a2a; border-radius: 3px; overflow: hidden;
      }
      #loading-bar { width: 0; height: 100%; background: #d33a22; transition: width 0.2s; }
      #fullscreen {
        position: absolute; right: 12px; bottom: 12px; width: 36px; height: 36px;
        border: 0; border-radius: 6px; background: rgba(255, 255, 255, 0.15); color: #fff;
        font-size: 20px; line-height: 36px; cursor: pointer;
      }
      #fullscreen:hover { background: rgba(255, 255, 255, 0.3); }
      #error { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #eee; font: 16px sans-serif; text-align: center; padding: 1rem; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" width="1024" height="768" tabindex="-1"></canvas>
      <div id="loading"><div id="loading-bar"></div></div>
      <button id="fullscreen" title="Full screen" aria-label="Full screen" hidden>&#x26F6;</button>
      <div id="error" hidden></div>
    </div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.getElementById("unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Outbreak",
        productVersion: "1.0",
        // The 2011 GUI is laid out in 1024x768 pixels: keep that render size and let CSS scale it.
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1,
      }, function (progress) {
        document.getElementById("loading-bar").style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        document.getElementById("loading").hidden = true;
        var fullscreen = document.getElementById("fullscreen");
        fullscreen.hidden = false;
        fullscreen.onclick = function () { unityInstance.SetFullscreen(1); };
        canvas.focus();
      }).catch(function (message) {
        document.getElementById("loading").hidden = true;
        var error = document.getElementById("error");
        error.textContent = message;
        error.hidden = false;
      });
    </script>
  </body>
</html>
